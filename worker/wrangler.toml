name = "maproll-mcp"
main = "index.ts"
compatibility_date = "2026-01-01"

# The published npm package points at mcp.maproll.io, so the hostname is part
# of the contract — installed clients cannot be asked to change it.
routes = [{ pattern = "mcp.maproll.io", custom_domain = true }]

# Secrets, set with `wrangler secret put`:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#
# The anon key is public by design (it ships in the editor's browser bundle);
# it lives here so the npm package holds no credential and the backing store
# can change without republishing.

[observability]
enabled = true
